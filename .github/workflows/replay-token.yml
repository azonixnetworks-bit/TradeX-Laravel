name: TradeX Replay JWT Issuer

on:
  push:
    branches: [main]
    paths:
      - 'app/Http/Controllers/Api/Replay/**'
      - 'config/replay.php'
      - 'routes/api.php'
      - 'tests/Feature/Api/Replay/**'
      - '.github/workflows/replay-token.yml'
  pull_request:
    paths:
      - 'app/Http/Controllers/Api/Replay/**'
      - 'config/replay.php'
      - 'routes/api.php'
      - 'tests/Feature/Api/Replay/**'
      - '.github/workflows/replay-token.yml'

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, mbstring, sqlite3, pdo_sqlite, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Install Laravel dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare isolated SQLite Laravel database
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
      - name: Assert Replay token route registered
        run: php artisan route:list --path=api/v1/replay/access-token
      - name: Test signed RS256 Replay JWT issuance
        run: php artisan test tests/Feature/Api/Replay/ReplayAccessTokenTest.php
