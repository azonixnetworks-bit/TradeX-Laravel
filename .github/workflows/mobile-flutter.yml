name: Mobile Flutter CI

on:
  push:
    branches:
      - 'feature/mobile-*'
    paths:
      - 'mobile/**'
      - 'docs/mobile/**'
      - '.github/workflows/mobile-flutter.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'docs/mobile/**'
      - '.github/workflows/mobile-flutter.yml'

permissions:
  contents: read

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native Android and iOS scaffolding for validation
        run: |
          flutter create --platforms=android,ios --project-name tradex_mobile --org com.tradex .
          rm -f test/widget_test.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug
